services:
  # Backend API
  - type: web
    name: apex-backend
    runtime: python
    rootDir: apps/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apex-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  # Dashboard Frontend
  - type: web
    name: apex-dashboard
    runtime: static
    rootDir: dashboard_v1
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://apex-backend-i7b0.onrender.com

databases:
  - name: apex-db
    plan: free
